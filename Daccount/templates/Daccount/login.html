<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به DRAXO</title>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px; border: 1px solid #8b5cf6; box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); width: 350px; text-align: center; }
        h2 { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #151720; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(90deg, #8b5cf6, #ec4899); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .error { color: #ff4d4d; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ورود به حساب</h2>
        
        {% if form.errors %}
            <div class="error">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">ورود</button>
        </form>
        
        <p style="margin-top: 15px; font-size: 14px;">حساب ندارید؟ <a href="{% url 'Daccount:signup' %}" style="color: #ec4899;">ثبت‌نام کنید</a></p>
    </div>
</body>
</html>
