<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وبلاگ DRAXO | اخبار و مقالات گیمینگ</title>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { background: #151720; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { color: #00f3ff; font-size: 24px; font-weight: bold; text-decoration: none; text-shadow: 0 0 10px #00f3ff; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .page-title { text-align: center; color: #ff007f; text-shadow: 0 0 15px #ff007f; margin-bottom: 40px; }
        
        /* کارت پست‌ها */
        .post-card { background: #151720; border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 30px; display: flex; transition: 0.3s; }
        .post-card:hover { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        .post-img { width: 300px; height: 200px; object-fit: cover; }
        .post-content { padding: 20px; flex: 1; }
        .post-title { color: #00f3ff; font-size: 22px; margin: 0 0 10px 0; text-decoration: none; display: block; }
        .post-title:hover { color: #fff; text-shadow: 0 0 10px #00f3ff; }
        .post-meta { font-size: 13px; color: #888; margin-bottom: 15px; }
        .post-summary { color: #ccc; line-height: 1.6; margin-bottom: 20px; }
        .btn-read { background: #8b5cf6; color: #fff; padding: 8px 20px; text-decoration: none; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">DRAXO</a>
        <a href="/" style="color: #fff; text-decoration: none;">بازگشت به فروشگاه</a>
    </header>

    <div class="container">
        <h1 class="page-title">اخبار و مقالات دنیای گیم</h1>

        {% for post in posts %}
            <div class="post-card">
                {% if post.image %}
                    <img src="{{ post.image.url }}" class="post-img" alt="{{ post.title }}">
                {% endif %}
                <div class="post-content">
                    <a href="{% url 'Dblog:post_detail' post.slug %}" class="post-title">{{ post.title }}</a>
                    <div class="post-meta">
                        نویسنده: {{ post.author.username }} | تاریخ: {{ post.created_at|date:"Y/m/d" }}
                    </div>
                    <p class="post-summary">{{ post.summary }}</p>
                    <a href="{% url 'Dblog:post_detail' post.slug %}" class="btn-read">ادامه مطلب ←</a>
                </div>
            </div>
        {% empty %}
            <p style="text-align: center; color: #888;">هنوز هیچ پستی منتشر نشده است.</p>
        {% endfor %}
    </div>
</body>
</html>
