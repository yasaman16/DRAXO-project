<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>محصولات {{ category.name }}</title>
    <style>
        body { background: #0b0c10; color: #fff; font-family: Tahoma; padding: 20px; }
        h1 { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; text-align: center; }
        .section-title { margin-top: 40px; border-bottom: 2px solid #ff007f; padding-bottom: 10px; }
        .grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .product-card { background: #151720; padding: 15px; border-radius: 10px; border: 1px solid #333; width: 200px; text-align: center; }
        .product-card:hover { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; }
        .price { color: #ff007f; font-weight: bold; margin: 10px 0; }
        .btn { background: #ff007f; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h1>بخش {{ category.name }}</h1>

    {% for title, products in product_sections %}
        <h2 class="section-title">{{ title }}</h2>
        <div class="grid">
            {% for product in products %}
                {% include "Dstore/_product_card.html" with product=product only %}
            {% endfor %}
        </div>
    {% empty %}
        <p>?? ??? ???? ?????? ?? ??? ???? ????? ????.</p>
    {% endfor %}
</body>
</html>
